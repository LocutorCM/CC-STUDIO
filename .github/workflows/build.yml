name: Build CC Studio (macOS Intel)
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-intel:
    name: macOS Intel • Monterey 12+
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check build tools
        run: |
          cmake --version
          ninja --version
          xcodebuild -version

      - name: Configure x86_64 build
        timeout-minutes: 10
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=x86_64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            -DJUCE_BUILD_EXTRAS=OFF \
            -DJUCE_BUILD_EXAMPLES=OFF \
            -DCMAKE_VERBOSE_MAKEFILE=ON

      - name: Build AU, VST3 and Standalone
        timeout-minutes: 25
        run: |
          cmake --build build --config Release --parallel 2 --verbose

      - name: Collect macOS plugins
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          find build -type d \( -name "*.vst3" -o -name "*.component" -o -name "*.app" \) -prune -print0 |
          while IFS= read -r -d '' bundle; do
            ditto "$bundle" "artifacts/$(basename "$bundle")"
          done
          test -n "$(find artifacts -mindepth 1 -maxdepth 1 -print -quit)"
          cd artifacts
          zip -qry ../CC-Studio-macOS-Intel-Monterey.zip .

      - name: Verify Intel architecture
        run: |
          find artifacts -type f -name "CC Studio" -print0 |
          while IFS= read -r -d '' binary; do
            file "$binary"
            lipo -info "$binary"
          done

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: CC-Studio-macOS-Intel-Monterey
          path: CC-Studio-macOS-Intel-Monterey.zip
          if-no-files-found: error
          retention-days: 14
